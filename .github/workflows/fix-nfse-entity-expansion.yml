name: Fix NFS-e entity expansion

on:
  push:
    paths:
      - '.github/workflows/fix-nfse-entity-expansion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrigir parser da resposta SOAP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = 'const parserBruto = new XMLParser({ ignoreAttributes: false, parseTagValue: false, processEntities: true });'
          new = 'const parserBruto = new XMLParser({ ignoreAttributes: false, parseTagValue: false, processEntities: false });'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('Configuração do parserBruto não localizada')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validar sintaxe
        run: node --check server.js
      - name: Commit e push
        run: |
          if git diff --quiet -- server.js; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'ChatGPT Finance'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js
          git commit -m 'fix(nfse): evitar limite de expansão ao ler respostas recebidas'
          git push
