name: Add NFS-e Recebidas

on:
  push:
    paths:
      - '.github/workflows/add-nfse-recebidas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar rota ConsultaNFeRecebidas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          fragment = Path('.patches/nfse-recebidas.fragment.js').read_text()
          source = p.read_text()
          marker = 'app.listen(PORT, () => console.log(`Conector NFS-e SP rodando na porta ${PORT}`));'
          if 'app.post("/nfse/recebidas"' in source:
              print('Rota já existe; nenhuma alteração necessária.')
              raise SystemExit(0)
          if marker not in source:
              raise SystemExit('Marcador app.listen não encontrado')
          p.write_text(source.replace(marker, fragment + '\n\n' + marker))
          PY
      - name: Validar sintaxe
        run: node --check server.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT Finance"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "feat(nfse): consultar notas recebidas da prefeitura"
          git push
