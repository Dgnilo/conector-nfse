name: Add NFS-e Recebidas

on:
  push:
    paths:
      - '.github/workflows/add-nfse-recebidas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Adicionar rota ConsultaNFeRecebidas
        env:
          PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          marker='app.listen(PORT, () => console.log(`Conector NFS-e SP rodando na porta ${PORT}`));'
          if 'app.post("/nfse/recebidas"' in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('Marcador app.listen não encontrado')
          block=base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          p.write_text(s.replace(marker, block + marker))
          PY
      - name: Validar sintaxe
        run: node --check server.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT Finance"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "feat(nfse): consultar notas recebidas da prefeitura"
          git push
